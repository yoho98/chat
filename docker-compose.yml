services:
  mysql:
    image: mysql:8.0
    container_name: sokind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: sokind_chat
      MYSQL_USER: sokind
      MYSQL_PASSWORD: sokindpw
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --innodb-autoinc-lock-mode=2
    ports:
      - "3307:3306"
    volumes:
      - sokind-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sokind-mysql-data:
