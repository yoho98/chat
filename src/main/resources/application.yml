spring:
  application:
    name: chat

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:sokind_chat}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:sokind}
    password: ${DB_PASSWORD:sokindpw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SokindHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.sokind.chat: DEBUG
    org.hibernate.SQL: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
  paths-to-match: /sessions/**, /actuator/**

projection:
  # Hybrid 의 catch-up 폴링 주기. 정상 경로(AFTER_COMMIT immediate)가 listener 로 처리하므로
  # 폴링은 listener 실패 / JVM crash 후 / DEAD 재시도 청소용. 200ms → 5s 로 격하.
  tick-ms: 5000
  # AFTER_COMMIT 직후 in-process 즉시 projection 활성화. false 면 폴링만 사용 (테스트 결정성용).
  immediate: true

snapshot:
  every-n: 5
