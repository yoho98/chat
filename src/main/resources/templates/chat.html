<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Sokind chat demo</title>
  <style>
    :root {
      --bg: #fafbfc;
      --card: #ffffff;
      --border: #e1e4e8;
      --text: #24292e;
      --muted: #6a737d;
      --primary: #2188ff;
      --success: #28a745;
      --warn: #f0ad4e;
      --danger: #d73a49;
      --me-bubble: #2188ff;
      --me-bubble-text: #fff;
      --them-bubble: #f1f3f5;
      --them-bubble-text: #24292e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      min-height: 100vh;
    }
    h1 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    h2 { font-size: 12px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; max-width: 1280px; margin: 0 auto; }
    .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    /* status badge */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500;
    }
    .badge::before { content:""; width:6px; height:6px; border-radius:50%; background: currentColor; }
    .badge.ok    { background: #e6f7ec; color: #1f7a3a; }
    .badge.err   { background: #fbe9eb; color: #a01828; }
    .badge.warn  { background: #fff5e1; color: #8a5800; }

    /* controls */
    .controls { display: flex; flex-wrap: wrap; gap: 6px; }
    .controls input, .controls select, .controls button {
      font: inherit; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
      background: #fff; color: var(--text);
    }
    .controls input[type=text] { flex: 1; min-width: 120px; }
    .controls button { cursor: pointer; background: #f6f8fa; }
    .controls button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .controls button.primary:hover { filter: brightness(1.06); }
    .controls button.danger { color: var(--danger); }

    /* chat list */
    .chat {
      flex: 1; min-height: 360px; max-height: 60vh; overflow-y: auto;
      padding: 8px 4px; display: flex; flex-direction: column; gap: 8px;
    }
    .msg { display: flex; flex-direction: column; max-width: 70%; }
    .msg.me   { align-self: flex-end; align-items: flex-end; }
    .msg.them { align-self: flex-start; align-items: flex-start; }
    .msg .meta { font-size: 11px; color: var(--muted); margin: 0 8px 2px; }
    .msg .bubble {
      padding: 8px 12px; border-radius: 16px; line-height: 1.4; font-size: 14px; word-break: break-word;
    }
    .msg.me   .bubble { background: var(--me-bubble);   color: var(--me-bubble-text); border-bottom-right-radius: 4px; }
    .msg.them .bubble { background: var(--them-bubble); color: var(--them-bubble-text); border-bottom-left-radius: 4px; }
    .msg.deleted .bubble { font-style: italic; opacity: 0.5; text-decoration: line-through; }
    .msg .edited { font-size: 10px; color: var(--muted); margin: 2px 8px 0; }
    .system { align-self: center; font-size: 11px; color: var(--muted); padding: 4px 10px; background: #f1f3f5; border-radius: 12px; }

    /* sidebar */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { padding: 8px; background: #f6f8fa; border-radius: 6px; }
    .stat .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat .value { font-size: 18px; font-weight: 600; margin-top: 2px; }

    .participant {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 6px;
    }
    .participant + .participant { margin-top: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.online  { background: var(--success); }
    .dot.offline { background: var(--muted); }
    .participant .uid { font-size: 13px; font-weight: 500; }
    .participant .pres { font-size: 10px; color: var(--muted); margin-left: auto; }

    .log {
      max-height: 200px; overflow-y: auto; font-family: ui-monospace, Menlo, monospace;
      font-size: 11px; color: var(--muted); white-space: pre-wrap; line-height: 1.5;
      background: #fafbfc; border-radius: 6px; padding: 6px 8px;
    }
    .log .info  { color: var(--text); }
    .log .replay{ color: var(--warn); }
    .log .err   { color: var(--danger); }

    code { background: #eef; padding: 1px 4px; border-radius: 3px; font-size: 11px; }
    pre  { background: #fafbfc; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
           font-size: 11px; max-height: 160px; overflow: auto; margin: 0; }
  </style>
</head>
<body>

<div class="layout">
  <!-- LEFT: chat -->
  <div class="col">
    <div class="card">
      <h1>
        <span>💬 Sokind 1:1 chat</span>
        <span id="status" class="badge err">disconnected</span>
      </h1>
      <div style="font-size:12px; color: var(--muted); margin-top:4px;">
        세션 ID: <code id="sidLabel">(없음)</code> · 나: <code id="meLabel">(없음)</code> · lastSeq=<code id="lastSeq">0</code>
      </div>

      <h2 style="margin-top:14px;">1) 세션</h2>
      <div class="controls">
        <button id="btnCreate" class="primary">+ 세션 생성</button>
        <input  id="sessionId" type="text" placeholder="sessionId (UUID)" />
        <input  id="userId"    type="text" placeholder="userId" style="max-width:120px"/>
        <button id="btnJoin">join</button>
        <button id="btnEnd" class="danger">end</button>
      </div>

      <h2 style="margin-top:14px;">2) WebSocket</h2>
      <div class="controls">
        <button id="btnConnect"    class="primary">connect</button>
        <button id="btnDisconnect" class="danger">disconnect</button>
      </div>
    </div>

    <div class="card" style="display:flex; flex-direction:column; flex:1;">
      <h2>대화</h2>
      <div id="chat" class="chat"></div>
      <div class="controls" style="margin-top:8px;">
        <select id="msgType">
          <option value="MESSAGE">메시지</option>
          <option value="EDIT">수정 (targetSeq=N,newText=…)</option>
          <option value="DELETE">삭제 (targetSeq=N)</option>
        </select>
        <input id="msgText" type="text" placeholder="여기에 입력 후 Enter" />
        <button id="btnSend" class="primary">전송</button>
      </div>
    </div>
  </div>

  <!-- RIGHT: sidebar -->
  <div class="col">
    <div class="card">
      <h2>통계</h2>
      <div class="stat-grid">
        <div class="stat"><div class="label">upToSeq</div><div class="value" id="statSeq">0</div></div>
        <div class="stat"><div class="label">메시지</div><div class="value" id="statMsgs">0</div></div>
        <div class="stat"><div class="label">참여자</div><div class="value" id="statPart">0</div></div>
        <div class="stat"><div class="label">중복 dedup</div><div class="value" id="statDup">0</div></div>
      </div>
    </div>

    <div class="card">
      <h2>참여자 (실시간 presence)</h2>
      <div id="participants">
        <div style="font-size:12px; color: var(--muted); padding:6px 8px;">(아직 없음)</div>
      </div>
    </div>

    <div class="card">
      <h2>Replay (시점 복원)</h2>
      <div class="controls">
        <input id="replayAt" type="text" placeholder="2099-01-01T00:00:00Z" />
        <button id="btnReplay">GET /timeline</button>
      </div>
      <pre id="timeline" style="margin-top:8px;">(empty)</pre>
    </div>

    <div class="card">
      <h2>세션 검색 (GET /sessions)</h2>
      <div class="controls">
        <select id="filterStatus">
          <option value="">status (any)</option>
          <option value="ACTIVE">ACTIVE</option>
          <option value="ENDED">ENDED</option>
        </select>
        <input id="filterUserId" type="text" placeholder="userId 필터" style="max-width:120px"/>
        <button id="btnSearchSessions" class="primary">검색</button>
      </div>
      <pre id="sessionsResult" style="margin-top:8px; max-height:160px;">(empty)</pre>
    </div>

    <div class="card">
      <h2>운영 / 디버깅</h2>
      <div class="controls">
        <button id="btnSnapshot" class="primary">+ 스냅샷 강제 생성</button>
        <button id="btnListEvents">events 조회</button>
        <button id="btnMetrics">메트릭 (sokind.*)</button>
      </div>
      <div style="font-size:11px; color: var(--muted); margin-top:6px;">
        스냅샷·events는 현재 sessionId 기준. 메트릭은 전역.
      </div>
      <pre id="opsResult" style="margin-top:8px; max-height:240px;">(empty)</pre>
    </div>

    <div class="card">
      <h2>이벤트 로그</h2>
      <div id="log" class="log"></div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  const BASE = window.location.origin;
  const $ = (id) => document.getElementById(id);

  let ws = null;
  let lastSeq = 0;
  let dupCount = 0;
  let me = '';
  /** seq -> {seq,userId,payload,deleted,editedAtSeq,clientTs} */
  const messages = new Map();
  /** userId -> 'ONLINE'|'OFFLINE' */
  const presence = new Map();

  function uuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = (Math.random() * 16) | 0;
      const v = c === 'x' ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  function timeFmt(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  function log(text, level) {
    const el = document.createElement('div');
    el.className = level || 'info';
    el.textContent = new Date().toISOString().substring(11,19) + '  ' + text;
    const wrap = $('log');
    wrap.insertBefore(el, wrap.firstChild);
    while (wrap.children.length > 80) wrap.removeChild(wrap.lastChild);
  }

  function setStatus(text, ok) {
    const el = $('status');
    el.textContent = text;
    el.className = 'badge ' + (ok ? 'ok' : 'err');
  }

  function applyEnvelope(m) {
    const seq = m.serverSeq;
    if (typeof seq === 'number' && seq > lastSeq) {
      lastSeq = seq;
      $('lastSeq').textContent = lastSeq;
    }
    switch (m.type) {
      case 'JOIN':       presence.set(m.userId, 'ONLINE');  break;
      case 'LEAVE':      presence.delete(m.userId);          break;
      case 'RECONNECT':  if (presence.has(m.userId)) presence.set(m.userId, 'ONLINE');  break;
      case 'DISCONNECT': if (presence.has(m.userId)) presence.set(m.userId, 'OFFLINE'); break;
      case 'MESSAGE':
        messages.set(seq, { seq, userId: m.userId, payload: m.payload, clientTs: m.clientTs, deleted: false, editedAtSeq: null });
        break;
      case 'EDIT': {
        const target = m.payload && m.payload.targetSeq;
        const existing = messages.get(target);
        if (existing && !existing.deleted) {
          existing.payload = (m.payload && m.payload.newPayload) || existing.payload;
          existing.editedAtSeq = seq;
        }
        break;
      }
      case 'DELETE': {
        const target = m.payload && m.payload.targetSeq;
        const existing = messages.get(target);
        if (existing) existing.deleted = true;
        break;
      }
    }
    renderChat();
    renderParticipants();
    renderStats();
  }

  function renderChat() {
    const wrap = $('chat');
    wrap.innerHTML = '';
    const ordered = [...messages.values()].sort((a,b) => a.seq - b.seq);
    for (const msg of ordered) {
      const div = document.createElement('div');
      div.className = 'msg ' + (msg.userId === me ? 'me' : 'them') + (msg.deleted ? ' deleted' : '');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${msg.userId} · ${timeFmt(msg.clientTs)} · seq=${msg.seq}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = msg.deleted ? '(삭제된 메시지)' : (msg.payload && msg.payload.text) || JSON.stringify(msg.payload);
      div.appendChild(meta);
      div.appendChild(bubble);
      if (msg.editedAtSeq) {
        const edited = document.createElement('div');
        edited.className = 'edited';
        edited.textContent = `편집됨 @ seq=${msg.editedAtSeq}`;
        div.appendChild(edited);
      }
      wrap.appendChild(div);
    }
    wrap.scrollTop = wrap.scrollHeight;
  }

  function renderParticipants() {
    const wrap = $('participants');
    wrap.innerHTML = '';
    if (presence.size === 0) {
      wrap.innerHTML = '<div style="font-size:12px; color: var(--muted); padding:6px 8px;">(아직 없음)</div>';
      return;
    }
    for (const [uid, pres] of presence) {
      const div = document.createElement('div');
      div.className = 'participant';
      div.innerHTML =
        `<span class="dot ${pres === 'ONLINE' ? 'online' : 'offline'}"></span>` +
        `<span class="uid">${uid}${uid === me ? ' (나)' : ''}</span>` +
        `<span class="pres">${pres}</span>`;
      wrap.appendChild(div);
    }
  }

  function renderStats() {
    $('statSeq').textContent  = lastSeq;
    $('statMsgs').textContent = [...messages.values()].filter(m => !m.deleted).length;
    $('statPart').textContent = presence.size;
    $('statDup').textContent  = dupCount;
  }

  // wire actions
  $('btnCreate').onclick = async () => {
    const r = await fetch(BASE + '/sessions', { method: 'POST' });
    const body = await r.json();
    $('sessionId').value = body.id;
    $('sidLabel').textContent = body.id;
    log('세션 생성: ' + body.id);
  };

  $('btnJoin').onclick = async () => {
    const sid = $('sessionId').value.trim();
    const uid = $('userId').value.trim() || 'anon';
    if (!sid) return alert('sessionId 필요');
    me = uid;
    $('meLabel').textContent = uid;
    const r = await fetch(BASE + '/sessions/' + sid + '/join', { method: 'POST', headers: { 'X-User-Id': uid }});
    const body = await r.json();
    if (body.duplicate) dupCount++;
    log(`join ${uid} → serverSeq=${body.serverSeq} dup=${body.duplicate}`);
    renderStats();
  };

  $('btnEnd').onclick = async () => {
    const sid = $('sessionId').value.trim();
    if (!sid) return alert('sessionId 필요');
    const r = await fetch(BASE + '/sessions/' + sid + '/end', { method: 'POST' });
    log('end → HTTP ' + r.status, r.ok ? 'info' : 'err');
  };

  $('btnConnect').onclick = () => {
    const sid = $('sessionId').value.trim();
    const uid = $('userId').value.trim() || 'anon';
    if (!sid) return alert('sessionId 필요');
    me = uid; $('meLabel').textContent = uid;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = `${proto}//${location.host}/ws/chat?session=${encodeURIComponent(sid)}&user=${encodeURIComponent(uid)}${lastSeq>0 ? `&since=${lastSeq}` : ''}`;
    ws = new WebSocket(url);
    ws.onopen    = ()   => { setStatus('connected', true);  log('WS open  ' + url); };
    ws.onclose   = (ev) => { setStatus('disconnected', false); log('WS close code=' + ev.code, 'err'); };
    ws.onerror   = ()   => { log('WS error', 'err'); };
    ws.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.duplicate) dupCount++;
        applyEnvelope(m);
        const tag = m.replay ? 'replay ' : '';
        log(`${tag}seq=${m.serverSeq} ${m.type} ${m.userId} ${JSON.stringify(m.payload || {})}`, m.replay ? 'replay' : 'info');
      } catch (e) { log('raw: ' + ev.data, 'err'); }
    };
  };

  $('btnDisconnect').onclick = () => { if (ws) ws.close(); };

  function buildPayload() {
    const type = $('msgType').value;
    const raw  = $('msgText').value;
    if (type === 'MESSAGE') return { type, payload: { text: raw } };
    if (type === 'EDIT') {
      const match = /targetSeq=(\d+).*newText=(.+)/.exec(raw);
      if (!match) { alert('형식: targetSeq=N,newText=…'); return null; }
      return { type, payload: { targetSeq: parseInt(match[1]), newPayload: { text: match[2] }}};
    }
    if (type === 'DELETE') {
      const match = /targetSeq=(\d+)/.exec(raw);
      if (!match) { alert('형식: targetSeq=N'); return null; }
      return { type, payload: { targetSeq: parseInt(match[1]) }};
    }
    return null;
  }

  $('btnSend').onclick = () => {
    if (!ws || ws.readyState !== 1) return alert('WS 연결 안 됨');
    const built = buildPayload();
    if (!built) return;
    const frame = {
      clientEventId: uuid(),
      type: built.type,
      payload: built.payload,
      clientTs: new Date().toISOString(),
    };
    ws.send(JSON.stringify(frame));
    $('msgText').value = '';
    log(`sent ${built.type} ${JSON.stringify(built.payload)}`);
  };
  $('msgText').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnSend').click(); });

  $('btnReplay').onclick = async () => {
    const sid = $('sessionId').value.trim();
    const at  = $('replayAt').value.trim() || new Date().toISOString();
    if (!sid) return alert('sessionId 필요');
    const r = await fetch(BASE + '/sessions/' + sid + '/timeline?at=' + encodeURIComponent(at));
    if (!r.ok) { log('replay HTTP ' + r.status, 'err'); return; }
    const body = await r.json();
    $('timeline').textContent = JSON.stringify(body, null, 2);
    log(`replay at=${at} upToSeq=${body.upToSeq} msgs=${body.messages.length}`, 'replay');
  };

  // ── 세션 검색 (참여자 필터 포함) ────────────────────────────────
  $('btnSearchSessions').onclick = async () => {
    const params = new URLSearchParams();
    const s = $('filterStatus').value.trim();
    const u = $('filterUserId').value.trim();
    if (s) params.set('status', s);
    if (u) params.set('userId', u);
    const r = await fetch(BASE + '/sessions' + (params.toString() ? '?' + params : ''));
    if (!r.ok) { log('search HTTP ' + r.status, 'err'); return; }
    const body = await r.json();
    $('sessionsResult').textContent = JSON.stringify(body, null, 2);
    log(`search sessions status=${s || '*'} userId=${u || '*'} → ${body.length}건`);
  };

  // ── 운영: 강제 스냅샷 / events 디버깅 / Prometheus 메트릭 ──────
  $('btnSnapshot').onclick = async () => {
    const sid = $('sessionId').value.trim();
    if (!sid) return alert('sessionId 필요');
    const r = await fetch(BASE + '/sessions/' + sid + '/snapshots', { method: 'POST' });
    if (!r.ok) { log('snapshot HTTP ' + r.status, 'err'); return; }
    const body = await r.json();
    $('opsResult').textContent = JSON.stringify(body, null, 2);
    log(`snapshot upToSeq=${body.upToSeq} created=${body.created}`);
  };

  $('btnListEvents').onclick = async () => {
    const sid = $('sessionId').value.trim();
    if (!sid) return alert('sessionId 필요');
    const r = await fetch(BASE + '/sessions/' + sid + '/events?limit=20');
    if (!r.ok) { log('events HTTP ' + r.status, 'err'); return; }
    const body = await r.json();
    $('opsResult').textContent = JSON.stringify(body, null, 2);
    log(`events ${body.items.length}건 nextFromSeq=${body.nextFromSeq}`);
  };

  $('btnMetrics').onclick = async () => {
    const r = await fetch(BASE + '/actuator/prometheus');
    if (!r.ok) { log('metrics HTTP ' + r.status, 'err'); return; }
    const text = await r.text();
    const filtered = text.split('\n').filter(l => l.startsWith('sokind_'));
    $('opsResult').textContent = filtered.length ? filtered.join('\n') : '(no sokind metrics yet)';
    log(`metrics ${filtered.length} lines`);
  };
</script>
</body>
</html>
